name: Trigger notification

on:
  workflow_dispatch:
    inputs:
      action:
        description: "assign (send duty) or remind (nudge if not done)"
        required: true
        default: assign
        type: choice
        options: [assign, remind]
      task:
        description: "Which task to trigger"
        required: true
        default: kitchen
        type: choice
        options: [kitchen, fullclean, toilet, waste]
      start_from:
        description: "Kitchen assign only — member name to start rotation from (leave blank to continue in order)"
        required: false
        default: ""

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_HOST_KEY }}" > ~/.ssh/known_hosts

      - name: Fire trigger
        run: |
          FROM="${{ github.event.inputs.start_from }}"
          QUERY=""
          if [ -n "$FROM" ]; then
            QUERY="?from=${FROM}"
          fi

          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "curl -sf -X POST 'localhost:3099/${{ github.event.inputs.action }}/${{ github.event.inputs.task }}${QUERY}'"
