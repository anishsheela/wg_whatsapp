name: Trigger notification

on:
  workflow_dispatch:
    inputs:
      action:
        description: "assign (rotate + announce a task) or duties (just re-send today's list)"
        required: true
        default: assign
        type: choice
        options: [assign, duties]
      task:
        description: "Which task to assign (ignored for 'duties')"
        required: true
        default: kitchen
        type: choice
        options: [kitchen, toilet]
      start_from:
        description: "Member name to start the rotation from (leave blank to continue in order)"
        required: false
        default: ""

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_HOST_KEY }}" > ~/.ssh/known_hosts

      - name: Fire trigger
        run: |
          ACTION="${{ github.event.inputs.action }}"
          if [ "$ACTION" = "duties" ]; then
            PATH_="duties"
          else
            FROM="${{ github.event.inputs.start_from }}"
            QUERY=""
            if [ -n "$FROM" ]; then
              QUERY="?from=${FROM}"
            fi
            PATH_="assign/${{ github.event.inputs.task }}${QUERY}"
          fi

          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "curl -sf -X POST 'localhost:3099/${PATH_}'"
